name: CI/CD → Build, Push ECR & Deploy ECS

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION:          us-east-2
  ECR_REPOSITORY:      laura-api
  ECS_CLUSTER:         laura-cluster
  ECS_SERVICE:         laura-api-service
  ECS_TASK_DEFINITION: laura-api-task
  CONTAINER_NAME:      api-container

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Terraform — crea/actualiza infraestructura (RDS, ECR, ECS)
  # El docker build/push LO HACE el Job 2, no Terraform.
  # ─────────────────────────────────────────────────────────────────
  terraform:
    name: 🏗️ Infraestructura (Terraform)
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    outputs:
      alb_dns: ${{ steps.tf_output.outputs.alb_dns }}

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region:            ${{ env.AWS_REGION }}

    # ── Prepara el backend S3 (idempotente: no falla si ya existe) ────
    - name: 🪣 Crear bucket S3 para Terraform state (si no existe)
      run: |
        aws s3api create-bucket \
          --bucket laura-tf-state-xyz89b \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 2>/dev/null || true
        aws s3api put-bucket-versioning \
          --bucket laura-tf-state-xyz89b \
          --versioning-configuration Status=Enabled 2>/dev/null || true
      working-directory: .

    - name: 🔒 Crear tabla DynamoDB para locks de Terraform (si no existe)
      run: |
        aws dynamodb create-table \
          --table-name laura-terraform-locks \
          --attribute-definitions AttributeName=LockID,AttributeType=S \
          --key-schema AttributeName=LockID,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --region us-east-2 2>/dev/null || true
      working-directory: .

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.0"
        terraform_wrapper: false

    - name: Terraform Init
      run: terraform init -migrate-state -force-copy

    - name: Terraform Validate
      run: terraform validate

    # ── Importa recursos que ya existen en AWS pero no en el state ────
    # Si ya están en el state el import falla silenciosamente (|| true)
    - name: 📥 Importar recursos AWS existentes al state
      run: |
        # ECR Repository
        terraform import module.ecr.aws_ecr_repository.app laura-api 2>/dev/null || true

        # IAM Roles
        terraform import module.ecs.aws_iam_role.ecs_execution laura-ecs-execution-role 2>/dev/null || true
        terraform import module.ecs.aws_iam_role.ecs_task      laura-ecs-task-role      2>/dev/null || true

        # CloudWatch Log Group
        terraform import module.ecs.aws_cloudwatch_log_group.app /ecs/laura 2>/dev/null || true

        # ECS Cluster
        terraform import module.ecs.aws_ecs_cluster.main laura-cluster 2>/dev/null || true

        # ALB y Target Group (necesitan ARN)
        ALB_ARN=$(aws elbv2 describe-load-balancers \
          --names laura-alb \
          --query 'LoadBalancers[0].LoadBalancerArn' \
          --output text 2>/dev/null || echo "")
        if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
          terraform import module.ecs.aws_lb.main "$ALB_ARN" 2>/dev/null || true
        fi

        TG_ARN=$(aws elbv2 describe-target-groups \
          --names laura-tg \
          --query 'TargetGroups[0].TargetGroupArn' \
          --output text 2>/dev/null || echo "")
        if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
          terraform import module.ecs.aws_lb_target_group.app "$TG_ARN" 2>/dev/null || true
        fi

        # RDS Subnet Group
        terraform import module.rds.aws_db_subnet_group.main laura-db-subnet-group 2>/dev/null || true

        # RDS Instance
        terraform import module.rds.aws_db_instance.postgres laura-postgres 2>/dev/null || true

    - name: Terraform Plan
      run: |
        terraform plan \
          -var="db_password=${{ secrets.DB_PASSWORD }}" \
          -var="keycloak_issuer_uri=${{ secrets.KEYCLOAK_ISSUER_URI }}" \
          -out=plan.out

    - name: Terraform Apply
      run: terraform apply -auto-approve plan.out

    - name: Obtener URL del ALB
      id: tf_output
      run: |
        ALB_DNS=$(terraform output -raw alb_dns_name)
        echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker → Push ECR → Deploy ECS
  # Corre después de que Terraform termine correctamente.
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    needs: terraform

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Setup JDK 21 (caché de dependencias Maven)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region:            ${{ env.AWS_REGION }}

    - name: Login a Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, Tag y Push imagen a ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG:    ${{ github.sha }}
      run: |
        docker build \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Descargar Task Definition actual de ECS
      run: |
        aws ecs describe-task-definition \
          --task-definition ${{ env.ECS_TASK_DEFINITION }} \
          --query taskDefinition > task-definition.json

    - name: Inyectar nueva imagen en Task Definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name:  ${{ env.CONTAINER_NAME }}
        image:           ${{ steps.build-image.outputs.image }}

    - name: Desplegar en ECS (Zero Downtime)
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition:            ${{ steps.task-def.outputs.task-definition }}
        service:                    ${{ env.ECS_SERVICE }}
        cluster:                    ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

    - name: 🌐 URL de la API
      run: |
        ALB_DNS="${{ needs.terraform.outputs.alb_dns }}"
        echo "## 🚀 Deploy exitoso!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| 🌐 URL de la API | http://$ALB_DNS |" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Imagen | ${{ steps.build-image.outputs.image }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🕐 Desplegado | $(date '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Endpoints disponibles" >> $GITHUB_STEP_SUMMARY
        echo "- \`GET\`  http://$ALB_DNS/actuator/health" >> $GITHUB_STEP_SUMMARY
        echo "- \`GET\`  http://$ALB_DNS/dishes" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 **[Abrir API →](http://$ALB_DNS)**" >> $GITHUB_STEP_SUMMARY
