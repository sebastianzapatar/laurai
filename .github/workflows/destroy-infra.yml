name: 💣 Destruir Infraestructura (Terraform Destroy)

on:
  # Solo se ejecuta manualmente, NUNCA automático
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "DESTRUIR" para confirmar que quieres eliminar TODA la infraestructura'
        required: true
        type: string

env:
  AWS_REGION: us-east-2

jobs:
  destroy:
    name: 💣 Terraform Destroy
    runs-on: ubuntu-latest
    environment: production
    # Bloqueo de seguridad: solo corre si escribiste "DESTRUIR"
    if: github.event.inputs.confirm == 'DESTRUIR'
    defaults:
      run:
        working-directory: terraform

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region:            ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.0"
        terraform_wrapper: false

    - name: Terraform Init
      run: terraform init -migrate-state -force-copy

    - name: Terraform Destroy
      run: |
        terraform destroy \
          -auto-approve \
          -var="db_password=${{ secrets.DB_PASSWORD }}" \
          -var="keycloak_issuer_uri=${{ secrets.KEYCLOAK_ISSUER_URI }}"

    - name: ✅ Infraestructura eliminada
      run: echo "Toda la infraestructura ha sido destruida correctamente."
